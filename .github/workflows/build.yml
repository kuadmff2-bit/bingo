name: Build check
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Validate project
        run: npm run build
      - name: Validate Cloudflare Worker bundle
        run: npx wrangler@4.131.1 deploy --dry-run
